name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main  # Or your default branch

env:
  PROJECT_ID: YOUR_GCP_PROJECT_ID
  SERVICE_NAME: YOUR_CLOUD_RUN_SERVICE_NAME
  REGION: YOUR_CLOUD_RUN_REGION
  GAR_LOCATION: us-central1 # Or your artifact registry location like europe-west1
  REPOSITORY: YOUR_ARTIFACT_REGISTRY_REPOSITORY # e.g., my-app-repo

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Required for Workload Identity Federation

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Google Auth
      id: auth
      uses: 'google-github-actions/auth@v2'
      with:
        workload_identity_provider: 'projects/${{ env.PROJECT_ID }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider' # Replace with your WIF pool and provider
        service_account: 'your-service-account-email@${{ env.PROJECT_ID }}.iam.gserviceaccount.com' # Replace with your SAs email

    - name: Set up Cloud SDK
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: Authorize Docker push
      run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

    - name: Build and Push Docker image
      run: |-
        docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} .
        docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

    - name: Deploy to Cloud Run
      uses: 'google-github-actions/deploy-cloudrun@v2'
      with:
        service: ${{ env.SERVICE_NAME }}
        region: ${{ env.REGION }}
        image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        platform: 'managed'
        allow-unauthenticated: true # Or false, depending on desired access to the app itself
        env_vars: |
          PORT=8080
        secrets: |
          GOOGLE_CLIENT_ID=YOUR_GOOGLE_CLIENT_ID_SECRET_NAME:latest
          GOOGLE_CLIENT_SECRET=YOUR_GOOGLE_CLIENT_SECRET_SECRET_NAME:latest
          SESSION_SECRET=YOUR_SESSION_SECRET_SECRET_NAME:latest
